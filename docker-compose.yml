
services:

  eureka-server:
    image: customs-ebid-eureka-server:1.0
    container_name: eureka-server
    ports:
      - "8762:8761"
    networks:
      - customs-ebid-network

  user-auth-service:
    image: customs-ebid-user-auth:1.0
    container_name: user-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/customs_ebid_user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - customs-ebid-network

  api-gateway:
    image: customs-ebid-api-gateway:1.0
    container_name: api-gateway
    ports:
      - "8089:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - user-auth-service
    networks:
      - customs-ebid-network

  nginx:
    image: nginx:alpine
    container_name: customs-ebid-nginx
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    networks:
      - customs-ebid-network

networks:
  customs-ebid-network:
    driver: bridge
