
spring.application.name=user-auth-service

# Server
server.port=8081

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/customs_ebid_user_db}
spring.datasource.username=${DB_USERNAME:ebid_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=900000

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.config.import=optional:file:../.env[.properties]