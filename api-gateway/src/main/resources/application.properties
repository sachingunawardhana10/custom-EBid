# Application
spring.application.name=api-gateway
server.port=8080

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# User/Auth Service Route
spring.cloud.gateway.server.webflux.routes[0].id=user-auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never