# Application
spring.application.name=api-gateway
server.port=8080

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# User/Auth Service Route
# User/Auth Service Routes

spring.cloud.gateway.server.webflux.routes[0].id=user-auth-service-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-auth-service-users
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.server.webflux.routes[2].id=user-auth-service-admin
spring.cloud.gateway.server.webflux.routes[2].uri=lb://USER-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/admin/users/**
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never